name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        run: |
          git remote add upstream https://github.com/grodri99/bambi.git || true
          git fetch upstream main
          git merge --no-edit upstream/main || (echo "Merge conflict detected; manual review required" && exit 1)
          git push origin main
