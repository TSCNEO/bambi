name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.6)'
        required: false
        default: 'v1.0.6'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Versión base del repositorio upstream: se pasa a Gradle por entorno (BuildConfig.UPSTREAM_VERSION).
      - name: Resolve upstream base version
        run: |
          git remote add upstream https://github.com/grodri99/bambi.git 2>/dev/null || true
          git fetch upstream main 2>/dev/null || true
          # Read directly from upstream's build.gradle.kts to avoid tag namespace collisions
          UPSTREAM_TAG=$(git show upstream/main:app/build.gradle.kts 2>/dev/null | grep 'versionName = ' | head -n 1 | cut -d'"' -f2)
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(cat upstream_version.txt 2>/dev/null | tr -d '[:space:]')
          fi
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG="1.0.6"
          fi
          # Remove upstream remote so gh CLI uses origin (TSCNEO/bambi) as default repo
          git remote remove upstream 2>/dev/null || true
          echo "UPSTREAM_VERSION=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "Upstream base version: $UPSTREAM_TAG"

      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Release APKs (Stable and Beta)
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleStableRelease assembleBetaRelease

      - name: Prepare APK Assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/stable/release/app-stable-release.apk dist/Bambi.apk
          cp app/build/outputs/apk/beta/release/app-beta-release.apk dist/Bambi-Beta.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
          git tag -f "$TAG" || true
          git push origin "$TAG" --force || true
          gh release create "$TAG" dist/Bambi.apk dist/Bambi-Beta.apk \
            --repo "${{ github.repository }}" \
            --title "Bambi $TAG" \
            --notes "Release de Bambi con soporte de fuentes directas y variantes estables y beta."
